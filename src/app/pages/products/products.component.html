
<section class="px-6 py-12 md:px-20">

  <div class="mx-auto max-w-7xl">

    <h1 class="mb-8 text-4xl font-black">
      Nuestros Productos
    </h1>

    <!-- Buscador -->

    <input
      type="text"
      placeholder="Buscar producto..."
      [(ngModel)]="filtro"
      (input)="filtrar()"
      class="mb-6 w-full rounded-xl border p-3">

    <!-- Categorías -->

    <div class="mb-8 flex flex-wrap gap-3">

      @for (categoria of categorias; track categoria) {

        <button
          (click)="categoriaSeleccionada = categoria; filtrar()"
          class="rounded-full bg-amber-100 px-4 py-2">

          {{ categoria }}

        </button>

      }

    </div>

    <!-- Productos -->

    <div
      class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">

      @for(producto of productosFiltrados; track producto.id){

        <app-product-card
          [product]="producto">
        </app-product-card>

      }

    </div>

  </div>

</section>
